<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Door of the Lord's Prayer · Sagrada Família</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="intro">
  <header class="top">
    <h1>Our Father door <span>Sagrada Família · Glory façade</span></h1>
    <div class="search">
      <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="list" aria-autocomplete="list"
             placeholder="Search a language…" autocomplete="off" spellcheck="false">
      <button id="clear" type="button" aria-label="Clear" hidden>×</button>
      <ul id="list" role="listbox" hidden></ul>
    </div>
    <p id="status" class="status">Tap the door or search to find a language.</p>
    <button id="jump" type="button" hidden>Read full text ↓</button>
  </header>

  <main>
    <div id="door" class="door">
      <div class="stage">
      <img src="door.jpg" alt="Bronze door with the Lord's Prayer in Catalan and the daily-bread petition in 50 languages" draggable="false">
      <svg id="hl" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs><filter id="spot" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><feGaussianBlur stdDeviation="0.9"/></filter>
          <mask id="cut"><rect width="100" height="100" fill="#fff"/><g id="holes" filter="url(#spot)"></g></mask></defs>
        <rect id="dim" width="100" height="100" mask="url(#cut)"/>
        <g id="rings"></g>
      </svg>
      <svg id="lit" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="feather" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><feGaussianBlur stdDeviation="0.22"/></filter>
          <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><feGaussianBlur stdDeviation="0.9"/></filter>
          <filter id="bloomBlur" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><feGaussianBlur stdDeviation="0.35"/></filter>
          <linearGradient id="sweepGrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
          <mask id="m-base" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><g id="g-base" filter="url(#feather)"></g></mask>
          <mask id="m-bloom" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><g id="g-bloom" filter="url(#soft)"></g></mask>
          <mask id="m-sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><g id="g-sweep"></g></mask>
          <g id="clips"></g>
        </defs>
        <image href="door-lit.jpg" width="100" height="100" preserveAspectRatio="none" filter="url(#bloomBlur)" mask="url(#m-bloom)" opacity="1"/>
        <image href="door-lit.jpg" width="100" height="100" preserveAspectRatio="none" mask="url(#m-base)" opacity="1"/>
        <image href="door-lit.jpg" width="100" height="100" preserveAspectRatio="none" mask="url(#m-sweep)"/>
      </svg>
      </div>
      <article id="panel" class="panel" aria-live="polite">
        <div id="head" class="head">
          <div class="grab" aria-hidden="true"></div>
          <button id="close" type="button" aria-label="Close">×</button>
          <h2 id="p-name"></h2>
          <p id="p-native" class="native"></p>
          <p id="p-note" class="note"></p>
        </div>
        <div id="p-text" class="prayer"></div>
      </article>
    </div>
  </main>

  <footer>Lettering by Josep Maria Subirachs and Bruno Gallart. Highlight positions are hand-estimated; prayer texts marked “check” were written from memory.</footer>

  <div class="grain" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
